[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "eigen-portfolios"
version = "0.1.0"
description = "PCA on financial returns with Marchenko-Pastur random matrix theory for signal/noise separation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Fatih Hekimoglu", email = "fatih.hekim1@hotmail.com" },
]
keywords = [
    "pca",
    "random-matrix-theory",
    "marchenko-pastur",
    "quantitative-finance",
    "eigen-portfolios",
    "factor-models",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "typer>=0.12",
]

[project.optional-dependencies]
data = [
    "yfinance>=0.2.40",
    "httpx>=0.27",
    "diskcache>=5.6",
    "pyarrow>=15.0",
]
viz = [
    "plotly>=5.20",
]
app = [
    "streamlit>=1.35",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "respx>=0.21",
]
dev = [
    "ruff==0.15.20",
    "mypy>=1.10",
    "pandas-stubs",
    "build>=1.2",
]

[project.scripts]
eigenportfolios = "eigenportfolios.cli:app"

[project.urls]
Homepage = "https://github.com/FatihHekim0glu/eigen-portfolios"
Repository = "https://github.com/FatihHekim0glu/eigen-portfolios"
Issues = "https://github.com/FatihHekim0glu/eigen-portfolios/issues"
Changelog = "https://github.com/FatihHekim0glu/eigen-portfolios/blob/main/CHANGELOG.md"
Platform = "https://fatihhekimoglu-platform.vercel.app/tools/eigen-portfolios"

[tool.hatch.build.targets.wheel]
packages = ["src/eigenportfolios"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/CITATION.cff",
    "/pyproject.toml",
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "PL",
    "RUF",
    "NPY",
    "PD",
]
ignore = [
    "N803",
    "N806",
    "PLR0913",
    "PLR2004",
    "PLR0912",
    "PLR0915",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "PLR2004",
    "S101",
    "PD901",
    "N802",
    "N816",
    "PLC0415",
    "PLR0124",
    "PLR0911",
    "SIM108",
]
"app.py" = [
    "PLC0415",
    "E402",
    "E501",
]
"src/eigenportfolios/data.py" = [
    "PLC0415",
]

[tool.ruff.lint.isort]
known-first-party = ["eigenportfolios"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
files = ["src/eigenportfolios"]

[[tool.mypy.overrides]]
module = [
    "scipy",
    "scipy.*",
    "sklearn",
    "sklearn.*",
    "yfinance",
    "yfinance.*",
    "plotly",
    "plotly.*",
    "streamlit",
    "streamlit.*",
    "diskcache",
    "diskcache.*",
    "httpx",
    "httpx.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "unit: fast isolated unit tests",
    "parity: parity tests against reference implementations",
    "regression: numerical regression tests",
    "property: hypothesis property tests",
    "network: tests requiring network access",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pkg_resources.*",
    "ignore::PendingDeprecationWarning",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["src/eigenportfolios"]
omit = [
    "src/eigenportfolios/__init__.py",
]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]

[tool.coverage.paths]
source = ["src/eigenportfolios", "*/site-packages/eigenportfolios"]
